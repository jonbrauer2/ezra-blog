---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title p-name">{{ page.title | escape }}</h1>
    {%- if page.subtitle -%}
    <p class="post-subtitle" style="font-size: 1.15em; color: #828282; margin-top: -0.5em; margin-bottom: 1.5em;"><em>{{ page.subtitle | escape }}</em></p>
    {%- endif -%}
  </header>

  <div class="post-content e-content">
    {{ content }}
  </div>
</article>
