name: Daily rebuild

on:
  schedule:
    # 1:00 AM ET = 05:00 UTC (EDT/summer); shifts to 12:00 AM ET in winter (EST)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger GitHub Pages rebuild
        run: |
          git config user.email "noreply@github.com"
          git config user.name "Daily Rebuild"
          git commit --allow-empty -m "chore: daily rebuild $(date -u +%Y-%m-%d)"
          git push