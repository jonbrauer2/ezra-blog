name: Daily rebuild

on:
  schedule:
    # 12:30 AM ET = 04:30 UTC (EDT/summer); shifts to 11:30 PM ET in winter (EST)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger GitHub Pages rebuild
        run: |
          git config user.email "noreply@github.com"
          git config user.name "Daily Rebuild"
          git commit --allow-empty -m "chore: daily rebuild $(date -u +%Y-%m-%d)"
          git push
