name: Validate Kitty Chronicles automation

on:
  push:
    paths:
      - ".github/workflows/weekly-kitty-chronicles.yml"
      - ".github/workflows/kitty-chronicles-ci.yml"
      - "_data/kitty_chronicles_passages.json"
      - "_kittychronicles/**"
      - "assets/images/family/kittychronicles/volume-2/**"
      - "scripts/kitty_chronicles_generator.py"
      - "scripts/kitty-chronicles-requirements.txt"
      - "tests/test_kitty_chronicles.py"
  pull_request:
    paths:
      - ".github/workflows/weekly-kitty-chronicles.yml"
      - ".github/workflows/kitty-chronicles-ci.yml"
      - "_data/kitty_chronicles_passages.json"
      - "_kittychronicles/**"
      - "assets/images/family/kittychronicles/volume-2/**"
      - "scripts/kitty_chronicles_generator.py"
      - "scripts/kitty-chronicles-requirements.txt"
      - "tests/test_kitty_chronicles.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/kitty-chronicles-requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement scripts/kitty-chronicles-requirements.txt

      - name: Run unit and dry-run tests
        run: python -m unittest discover -s tests -p "test_kitty_chronicles.py" -v

      - name: Validate story files, images, and no-repeat ledger
        run: python scripts/kitty_chronicles_generator.py validate-repository
