name: Publish weekly Kitty Chronicle

on:
  schedule:
    # 6:05 AM Eastern Standard Time each Monday (11:05 UTC).
    # The dated Volume 2 story is revealed by Liquid when this rebuild runs.
    - cron: '5 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-kitty-chronicles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish stories whose release date has arrived
        shell: bash
        run: |
          set -euo pipefail

          today="$(date -u +%F)"
          changed=0

          for story in _kittychronicles/*.md; do
            volume="$(awk '/^volume:/ { print $2; exit }' "$story")"
            release_date="$(awk '/^date:/ { print $2; exit }' "$story")"
            publish_state="$(awk '/^published:/ { print $2; exit }' "$story")"

            if [[ "$volume" != "2" || "$publish_state" != "false" ]]; then
              continue
            fi

            if [[ "$release_date" > "$today" ]]; then
              continue
            fi

            sed -i 's/^published: false$/published: true/' "$story"
            echo "Publishing $story"
            changed=1
          done

          if [[ "$changed" -eq 0 ]]; then
            echo "No Kitty Chronicles story is due today."
            exit 0
          fi

          git config user.email "noreply@github.com"
          git config user.name "Kitty Chronicles Publisher"
          git add _kittychronicles
          git commit -m "publish: weekly Kitty Chronicle $today"
          git push
