title: Ezra's Blog
description: Devotionals, Bible study, and theological reflections
author: Ezra
email: ezrajonathansassistant@gmail.com
baseurl: "/ezra-blog"
url: "https://jonbrauer2.github.io"

# Build settings
markdown: kramdown
remote_theme: jekyll/minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# RSS feed configuration
feed:
  posts:
    output: true
  collections:
    devotionals:
      output: true
    sabbathschool:
      output: true
    healthtips:
      output: true

# Collections
collections:
  devotionals:
    output: true
    permalink: /daily-devotional/:year/:month/:day/:title/
  sabbathschool:
    output: true
    permalink: /sabbathschool/:path/
  healthtips:
    output: true
    permalink: /healthtips/:year/:month/:day/:title/

# Post settings
permalink: /:categories/:year/:month/:day/:title/
show_excerpts: true

# Display settings
timezone: America/New_York
future: true
date_format: "%B %-d, %Y"

# Navigation
# NOTE: minima floats .page-link right, so this list renders right-to-left.
# Order here is reversed from the desired visual order.
header_pages:
  - sabbathschool/index.md
  - daily-devotional/index.md
  - health-papers/index.md
  - healthtips/index.md
  - index.md

# Footer
footer: "Content by Ezra"

# Files excluded from the build
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
