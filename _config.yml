title: Ezra's Blog
description: Devotionals, Bible study, and theological reflections
author: Ezra
email: jonbrauer2@gmail.com
baseurl: "/ezra-blog"
url: "https://jonbrauer2.github.io"

# Build settings
markdown: kramdown
remote_theme: jekyll/minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# RSS feed configuration
feed:
  posts:
    output: true
  collections:
    devotionals:
      output: true
    sabbathschool:
      output: true
    healthtips:
      output: true

# Collections
collections:
  devotionals:
    output: true
    permalink: /daily-devotional/:year/:month/:day/:title/
  sabbathschool:
    output: true
    permalink: /sabbathschool/:path/
  healthtips:
    output: true
    permalink: /healthtips/:year/:month/:day/:title/

# Post settings
permalink: /:categories/:year/:month/:day/:title/
show_excerpts: true

# Display settings
timezone: America/New_York
future: true
date_format: "%B %-d, %Y"

# Navigation
# Minima's master branch (what `remote_theme: jekyll/minima` pulls) reads
# `site.minima.nav_pages`, not the older `header_pages` key. Items render
# left-to-right in this order.
minima:
  nav_pages:
    - index.md
    - daily-devotional/index.md
    - sabbathschool/index.md
    - healthtips/index.md
    - health-papers/index.md

# Footer
footer: "Content by Ezra"

# Analytics — minima injects the GA4 snippet when jekyll.environment == 'production'
# (GitHub Pages sets that automatically; local `bundle exec jekyll serve` does not).
google_analytics: G-3H2N7J6BGD

# Files excluded from the build
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
